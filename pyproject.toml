[project]
name = "tuner-platform-workspace"
version = "0.1.0"
description = "Workspace root for tuner-platform Python tooling"
requires-python = ">=3.13,<3.14"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["backend"]

[tool.uv.sources]
tuner-backend = { workspace = true }

[dependency-groups]
bdd = [
    "behave>=1.2.6",
    "tuner-backend",
    "httpx>=0.27",
]
skills = [
    "tuner-backend",
    "pyyaml>=6.0.2",
]
dev = [
    { include-group = "bdd" },
    { include-group = "skills" },
]
